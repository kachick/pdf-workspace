# https://taskfile.dev

version: '3'

# Style guide:
# - Limit tasks to a single command unless sequence execution is required
# - Define commands as separate tasks and combine them using deps
# - If a command takes more than a screenful of arguments, write a script file instead

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test

  test:
    cmds:
      - echo 'Update here'

  check:
    deps:
      - task: test
      - task: lint

  fmt:
    deps:
      - task: fmt-nix
      - task: fmt-dprint
      - task: fmt-typos

  fmt-nix:
    cmds:
      - git ls-files '*.nix' | xargs nix fmt

  fmt-dprint:
    cmds:
      - dprint fmt

  fmt-typos:
    cmds:
      - typos --write-changes

  lint:
    deps:
      - task: lint-nix
      - task: lint-dprint
      - task: lint-typos

  lint-nix:
    cmds:
      - git ls-files '*.nix' | xargs nixfmt --check

  lint-dprint:
    cmds:
      - dprint check

  lint-typos:
    cmds:
      - typos

  deps:
    cmds:
      - nix --version
      - nil --version
      - task --version
      - dprint --version
      - typos --version
      - tesseract --version
      - img2pdf --version
      - pngquant --version
